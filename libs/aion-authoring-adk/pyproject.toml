[tool.poetry]
name = "aion-authoring-adk"
version = "0.1.0"
description = "Aion Google ADK authoring toolkit"
authors = ["Terminal Research Team <support@terminal.exchange>"]
readme = "README.md"
packages = [{ include = "aion", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
google-adk = "^1.20.0"
# aion_lite_llm() builds on ADK's LiteLlm, which imports litellm directly.
litellm = "^1.93"
aion-api-client = { git = "https://github.com/Terminal-Research/aion-python-sdk", branch = "main", subdirectory = "libs/aion-api-client" }
aion-mcp = { git = "https://github.com/Terminal-Research/aion-python-sdk", branch = "main", subdirectory = "libs/aion-mcp" }

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
pytest-asyncio = ">=0.24"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: needs a real service or real processes; slower than a unit test",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
