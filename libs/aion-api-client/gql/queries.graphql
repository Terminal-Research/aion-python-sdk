subscription ChatCompletionStream(
  $request: ChatCompletionRequestInput!
  $principal: String
) {
  chatCompletionStream(request: $request, principal: $principal) {
    __typename
    ... on ChatCompletionStreamResponseChunk {
      response {
        id
        created
        model
        choices {
          index
          delta {
            role
            content
          }
          finishReason
        }
      }
    }
    ... on ChatCompletionStreamError {
      message
    }
  }
}

subscription A2AStream(
  $request: A2AJsonRpcRequestGQLInput!
  $target: CapabilitySubjectGQLInput!
  $principal: String
) {
  a2aRpc(request: $request, target: $target, principal: $principal) {
    __typename
    ... on A2AJsonRpcSuccessResponseGQL {
      id
      result
    }
    ... on A2AJsonRpcErrorResponseGQL {
      errorId: id
      error {
        code
        message
        data
      }
    }
  }
}

subscription VersionLogs($startTime: OffsetDateTime!) {
  versionLogs(startTime: $startTime) {
    level
    level_value
    timestamp
    message
    properties {
      key
      value
    }
  }
}

mutation StartAgentMailInboxSetup(
  $organizationId: ID!
  $targetId: ID!
  $methodKey: String!
  $operationKey: ID!
  $setup: ServiceAccountSetupStartInput!
) {
  startAuthentication(
    organizationId: $organizationId
    targetId: $targetId
    methodKey: $methodKey
    operationKey: $operationKey
    setup: $setup
  ) {
    outcome
    redirectUrl
    statusHandle
    setup {
      redirectUrl
      setupId
    }
  }
}

subscription AgentMailServiceAccountOptions($organizationId: ID!) {
  serviceAccountOptions(
    organizationId: $organizationId
    identityNetwork: AgentMail
    identityKinds: ["Inbox"]
  ) {
    accountLabel
    agentMail {
      addressDomain
    }
    accounts {
      integrationType
      networkType
      usageCount
      identity {
        id
        networkUserId
        identityNetwork
        identityKind
        userName
        name
      }
    }
    setups {
      id
      organizationId
      integrationType
      identityNetwork
      identityKind
      lifecycle
      reasonCode
      availableActions
      desiredProfile {
        displayName
        description
        avatarUrl
      }
      resultingServiceIdentityId
      latestSafeError
      createdAt
      updatedAt
      completedAt
      agentMail {
        emailAddress
      }
    }
  }
}
