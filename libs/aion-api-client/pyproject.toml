[tool.poetry]
name = "aion-api-client"
version = "0.1.0"
description = "Websocket GraphQL client for the Aion API"
authors = ["Terminal Research Team <support@terminal.exchange>"]
homepage = "https://github.com/Terminal-Research/aion-python-sdk"
readme = "README.md"
packages = [{ include = "aion", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12.0"
gql = ">=3.4.1,<4.0.0"
PyJWT = "^2.9.0"
httpx = "^0.28.1"
websockets = ">=15.0.1,<16.0.0"

aion-core = { git = "https://github.com/Terminal-Research/aion-python-sdk", branch = "main", subdirectory = "libs/aion-core" }

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
pytest-asyncio = ">=0.24"
# Generates the GraphQL client under src/aion/api/gql/generated/, which is
# committed. Nothing imports it at runtime, so it is a development tool and
# must not be a requirement of the published distribution.
ariadne-codegen = { version = "==0.18.0", extras = ["subscriptions"] }

[tool.ariadne-codegen]
schema_path = "gql/schema.graphql"
queries_path = "gql/queries.graphql"
target_package_path = "src/aion/api/gql/generated"
client_name = "GqlClient"
async_client = true
enable_custom_operations = true
opentelemetry_client = true
plugins = ["ariadne_codegen.contrib.extract_operations.ExtractOperationsPlugin"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "integration: needs a real service or real processes; slower than a unit test",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
